syntax = "proto3";

package raft;

option go_package = "github.com/CyberMoonie/raftkv/internal/raft/raftpb";

// Raft is the RPC interface between cluster nodes (Figure 2 of the paper).
service Raft {
  rpc RequestVote(RequestVoteRequest) returns (RequestVoteResponse);
  rpc AppendEntries(AppendEntriesRequest) returns (AppendEntriesResponse);
  rpc InstallSnapshot(InstallSnapshotRequest) returns (InstallSnapshotResponse);
}

// Member is one node of the cluster.
message Member {
  string id = 1;
  string raft_addr = 2;   // where other nodes send Raft RPCs
  string client_addr = 3; // where Redis clients are redirected to
}

enum EntryType {
  ENTRY_TYPE_COMMAND = 0; // data is a state machine command
  ENTRY_TYPE_NOOP = 1;    // appended by every new leader
  ENTRY_TYPE_CONFIG = 2;  // data is a Configuration
}

// Configuration is the set of members. A node uses the latest one in its
// log as soon as it is appended, committed or not (dissertation §4.1).
message Configuration {
  repeated Member members = 1;
}

message Entry {
  uint64 index = 1;
  uint64 term = 2;
  EntryType type = 3;
  bytes data = 4;
}

message RequestVoteRequest {
  uint64 term = 1;
  string candidate_id = 2;
  uint64 last_log_index = 3;
  uint64 last_log_term = 4;
  // pre_vote asks "would you vote for me in this term?" without the
  // candidate or the voter changing any state (dissertation §9.6).
  bool pre_vote = 5;
}

message RequestVoteResponse {
  uint64 term = 1;
  bool vote_granted = 2;
}

message AppendEntriesRequest {
  uint64 term = 1;
  string leader_id = 2;
  uint64 prev_log_index = 3;
  uint64 prev_log_term = 4;
  repeated Entry entries = 5;
  uint64 leader_commit = 6;
}

message AppendEntriesResponse {
  uint64 term = 1;
  bool success = 2;
  // On failure, where the leader should retry from: the first index of the
  // conflicting term (conflict_term), or the end of a too-short log
  // (conflict_term = 0). Lets the leader skip a whole term per round trip.
  uint64 conflict_index = 3;
  uint64 conflict_term = 4;
}

// HardState is the part of a node's state that must survive a crash besides
// the log: forgetting the term or the vote could elect two leaders in one
// term.
message HardState {
  uint64 term = 1;
  string voted_for = 2;
}

// Snapshot is the state machine as of last_index. It replaces every log
// entry up to and including last_index.
message Snapshot {
  uint64 last_index = 1;
  uint64 last_term = 2;
  bytes data = 3;
  Configuration config = 4; // the configuration as of last_index
}

// The whole snapshot travels in one message; Figure 13 of the paper splits
// it into chunks, which only matters for snapshots far larger than ours.
message InstallSnapshotRequest {
  uint64 term = 1;
  string leader_id = 2;
  Snapshot snapshot = 3;
}

message InstallSnapshotResponse {
  uint64 term = 1;
}
